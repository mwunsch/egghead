name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - otp: "28"
            elixir: "1.19"

    steps:
      - uses: actions/checkout@v4

      # Linux runtime deps:
      #  - inotify-tools: file_system shells out to inotifywait
      #  - bubblewrap:    Egghead.Sandbox uses bwrap to fence subprocesses
      #                   (Sandbox + ProcEval/ProcExec negative tests assert
      #                   the fence holds, which can't be validated when
      #                   bwrap is missing — Sandbox falls through to
      #                   "running unsandboxed" and the escapes succeed).
      - name: Install runtime deps
        run: sudo apt-get update && sudo apt-get install -y inotify-tools bubblewrap

      # Ubuntu 24.04 ships with kernel.apparmor_restrict_unprivileged_userns=1,
      # which blocks CAP_NET_ADMIN inside an unprivileged user namespace.
      # bwrap --unshare-net creates a fresh netns and unconditionally tries
      # to bring up the loopback interface (RTM_NEWADDR), which fails:
      #   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      # Flipping this sysctl restores the pre-24.04 behavior so bwrap can
      # set up its own loopback. Same workaround GH's runner-images repo
      # documents for any tool that uses unprivileged user namespaces.
      - name: Allow unprivileged user namespaces (AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
