name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - run: mix test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: macos_arm64
            asset: egghead-aarch64-macos
          - runner: ubuntu-latest
            target: linux_x64
            asset: egghead-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            asset: egghead-aarch64-linux
          # macos_x64 dropped: GitHub deprecated free Intel macOS
          # runners. Apple has shipped only ARM since 2020. Intel Mac
          # users can build from source or run the arm64 binary under
          # Rosetta. Re-add via macos-13-large (paid) if needed.

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # Burrito's pre_check requires `zig` and `xz` on PATH. xz is for
      # compressing the embedded payload; zig compiles the wrapper
      # launcher per-target. macOS ships xz; Linux needs xz-utils.
      - name: Install xz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      # Burrito 1.5.0 enforces an exact Zig version (see
      # deps/burrito/lib/burrito.ex). Bump in lockstep with Burrito.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.target }}-mix-prod-${{ hashFiles('**/mix.lock') }}

      - env:
          MIX_ENV: prod
        run: mix deps.get

      - env:
          MIX_ENV: prod
        run: mix deps.compile

      - name: Fingerprint static assets
        env:
          MIX_ENV: prod
        run: mix phx.digest

      - name: Build release
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.target }}
        run: mix release

      - name: Package
        run: |
          mkdir -p staging/${{ matrix.asset }}
          cp burrito_out/* staging/${{ matrix.asset }}/egghead
          chmod +x staging/${{ matrix.asset }}/egghead
          if [ -d man ]; then
            cp -r man staging/${{ matrix.asset }}/
          fi
          tar czf ${{ matrix.asset }}.tar.gz -C staging ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
